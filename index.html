    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #6b1f2d 0%, #7a1f2f 50%, #6b1f2d 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Floating hearts animation */
        body::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle, rgba(255, 255, 255, 0.1) 1px, transparent 1px),
                radial-gradient(circle, rgba(255, 192, 203, 0.1) 1px, transparent 1px);
            background-size: 50px 50px, 80px 80px;
            background-position: 0 0, 40px 40px;
            animation: float 20s linear infinite;
            pointer-events: none;
        }

        @keyframes float {
            0% { transform: translateY(0); }
            100% { transform: translateY(-100px); }
        }

        .container {
            width: 90%;
            max-width: 900px;
            padding: 2rem;
            z-index: 1;
        }

        .title {
            text-align: center;
            color: #fff;
            font-size: clamp(2.5rem, 6vw, 4rem);
            font-weight: 400;
            font-family: 'Cormorant Garamond', serif;
            letter-spacing: 3px;
            margin-bottom: 3rem;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            animation: fadeIn 1s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .carousel-container {
            position: relative;
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
            height: 70vh;
            max-height: 600px;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 
                0 20px 60px rgba(0, 0, 0, 0.4),
                0 0 40px rgba(255, 192, 203, 0.2);
            background: rgba(0, 0, 0, 0.2);
            animation: scaleIn 0.8s ease-out 0.3s both;
        }

        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .carousel-track {
            display: flex;
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            height: 100%;
        }

        .carousel-slide {
            min-width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1a1a1a;
            position: relative;
        }

        .carousel-slide img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        /* Placeholder for empty slides */
        .carousel-slide:not(:has(img))::after {
            content: attr(data-number);
            font-size: 4rem;
            color: rgba(255, 255, 255, 0.1);
            font-weight: 200;
        }

        .carousel-dots {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            z-index: 10;
            padding: 10px 20px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 50px;
            backdrop-filter: blur(10px);
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.4);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .dot.active {
            background: #fff;
            width: 24px;
            border-radius: 4px;
        }

        .carousel-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            z-index: 10;
        }

        .carousel-nav:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-50%) scale(1.1);
        }

        .carousel-nav.prev {
            left: 20px;
        }

        .carousel-nav.next {
            right: 20px;
        }

        .footer {
            text-align: center;
            margin-top: 2rem;
            color: rgba(255, 255, 255, 0.9);
            font-size: 1.2rem;
            font-weight: 300;
            font-family: 'Cormorant Garamond', serif;
            letter-spacing: 2px;
            line-height: 1.8;
            animation: fadeIn 1s ease-out 0.5s both;
        }

        /* Mobile responsiveness */
        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }

            .carousel-container {
                border-radius: 16px;
                height: 60vh;
                max-height: 500px;
            }

            .carousel-nav {
                width: 40px;
                height: 40px;
                font-size: 1.2rem;
            }

            .carousel-nav.prev {
                left: 10px;
            }

            .carousel-nav.next {
                right: 10px;
            }

            .dot {
                width: 6px;
                height: 6px;
            }

            .dot.active {
                width: 18px;
            }

            .carousel-dots {
                bottom: 15px;
                padding: 8px 16px;
                gap: 6px;
            }
        }

        /* Hide navigation on very small screens */
        @media (max-width: 480px) {
            .carousel-nav {
                display: none;
            }
        }
    </style>
</head>

    <script>
        let currentSlide = 0;
        const slides = document.querySelectorAll('.carousel-slide');
        const totalSlides = slides.length;
        const track = document.getElementById('carouselTrack');
        const dotsContainer = document.getElementById('dotsContainer');
        let autoplayInterval;

        // Check if image exists and try alternative extension
        function tryLoadImage(img, baseUrl, number) {
            const extensions = ['jpg', 'png', 'jpeg'];
            let currentExtIndex = 0;

            function tryNext() {
                if (currentExtIndex < extensions.length) {
                    const url = `${baseUrl}${number}.${extensions[currentExtIndex]}`;
                    img.src = url;
                    currentExtIndex++;
                } else {
                    // If all extensions fail, show placeholder
                    img.style.display = 'none';
                }
            }

            img.onerror = function() {
                tryNext();
            };

            // Start trying
            tryNext();
        }

        // Load images with automatic extension detection
        slides.forEach((slide, index) => {
            const img = slide.querySelector('img');
            if (img) {
                tryLoadImage(img, 'photos/', index + 1);
            }
        });

        // Create dots
        for (let i = 0; i < totalSlides; i++) {
            const dot = document.createElement('div');
            dot.className = 'dot';
            if (i === 0) dot.classList.add('active');
            dot.onclick = () => goToSlide(i);
            dotsContainer.appendChild(dot);
        }

        const dots = document.querySelectorAll('.dot');

        function updateCarousel() {
            track.style.transform = `translateX(-${currentSlide * 100}%)`;
            
            dots.forEach((dot, index) => {
                dot.classList.toggle('active', index === currentSlide);
            });
        }

        function moveSlide(direction) {
            currentSlide += direction;
            
            if (currentSlide < 0) {
                currentSlide = totalSlides - 1;
            } else if (currentSlide >= totalSlides) {
                currentSlide = 0;
            }
            
            updateCarousel();
            resetAutoplay();
        }

        function goToSlide(index) {
            currentSlide = index;
            updateCarousel();
            resetAutoplay();
        }

        function autoplay() {
            autoplayInterval = setInterval(() => {
                moveSlide(1);
            }, 4000); // Change slide every 4 seconds
        }

        function resetAutoplay() {
            clearInterval(autoplayInterval);
            autoplay();
        }

        // Start autoplay when page loads
        autoplay();

        // Pause autoplay on hover (optional)
        const carouselContainer = document.querySelector('.carousel-container');
        carouselContainer.addEventListener('mouseenter', () => {
            clearInterval(autoplayInterval);
        });

        carouselContainer.addEventListener('mouseleave', () => {
            autoplay();
        });

        // Swipe support for mobile
        let touchStartX = 0;
        let touchEndX = 0;

        carouselContainer.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
        });

        carouselContainer.addEventListener('touchend', (e) => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        });

        function handleSwipe() {
            if (touchEndX < touchStartX - 50) {
                moveSlide(1);
            }
            if (touchEndX > touchStartX + 50) {
                moveSlide(-1);
            }
        }

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') moveSlide(-1);
            if (e.key === 'ArrowRight') moveSlide(1);
        });

        // Animated favicon
        const canvas = document.getElementById("fav-canvas");
        const ctx = canvas.getContext("2d");
        const favicon = document.getElementById("favicon");

        let t = 0;

        function drawHeart(scale) {
            ctx.clearRect(0,0,16,16);
            ctx.save();
            ctx.translate(8,8);
            ctx.scale(scale, scale);
            ctx.translate(-8,-8);

            ctx.fillStyle = "#d60000";
            ctx.beginPath();
            ctx.moveTo(8,13);
            ctx.bezierCurveTo(2,9,2,4,5,4);
            ctx.bezierCurveTo(7,4,8,6,8,6);
            ctx.bezierCurveTo(8,6,9,4,11,4);
            ctx.bezierCurveTo(14,4,14,9,8,13);
            ctx.fill();

            ctx.restore();
        }

        function animateFavicon() {
            const scale = 1 + 0.12 * Math.sin(t);
            drawHeart(scale);
            favicon.href = canvas.toDataURL("image/png");
            t += 0.2;
            requestAnimationFrame(animateFavicon);
        }

        animateFavicon();
    </script>
